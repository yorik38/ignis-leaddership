<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">FORGE system architecture</title>
  <desc id="desc">A white, layered structure chart showing how a bid or tender team uses governed AI coordination, specialist work, shared rules, trusted information and approved tools before human review and approval.</desc>
  <rect width="1200" height="760" fill="#FFFFFF"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, Arial, sans-serif">
    <text x="60" y="48" font-size="19" font-weight="600" fill="#14181F">How your team works with FORGE</text>
    <text x="60" y="75" font-size="13" fill="#586170">AI prepares the structured work. Named people review, decide and approve.</text>

    <rect x="340" y="104" width="520" height="78" rx="4" fill="#FFFFFF" stroke="#B9C7D4"/>
    <text x="600" y="130" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.2" fill="#1B3A63">YOUR BID OR TENDER TEAM</text>
    <text x="600" y="151" text-anchor="middle" font-size="13" fill="#14181F">Chooses the outcome · reviews the evidence</text>
    <text x="600" y="169" text-anchor="middle" font-size="13" fill="#14181F">Owns the decision</text>

    <line x1="600" y1="182" x2="600" y2="198" stroke="#98A5B5" stroke-width="1.25"/>
    <polygon points="596,194 600,202 604,194" fill="#98A5B5"/>

    <rect x="260" y="202" width="680" height="74" rx="4" fill="#12213A"/>
    <text x="600" y="230" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.4" fill="#C8D7E5">GOVERNED AI COORDINATION</text>
    <text x="600" y="254" text-anchor="middle" font-size="14" fill="#FFFFFF">Runs the agreed workflow · coordinates the work · assembles evidence · stops for review</text>

    <line x1="600" y1="276" x2="600" y2="306" stroke="#98A5B5" stroke-width="1.25"/>
    <line x1="130" y1="306" x2="1070" y2="306" stroke="#D7DEE5" stroke-width="1.25"/>
    <g stroke="#D7DEE5" stroke-width="1.25">
      <line x1="145" y1="306" x2="145" y2="326"/><line x1="327" y1="306" x2="327" y2="326"/>
      <line x1="509" y1="306" x2="509" y2="326"/><line x1="691" y1="306" x2="691" y2="326"/>
      <line x1="873" y1="306" x2="873" y2="326"/><line x1="1055" y1="306" x2="1055" y2="326"/>
    </g>

    <text x="60" y="294" font-size="10" font-weight="700" letter-spacing="1.1" fill="#646E7A">SPECIALIST WORK</text>

    <g font-size="12" text-anchor="middle">
      <g transform="translate(60,326)"><rect width="170" height="86" rx="4" fill="#FFFFFF" stroke="#B9C7D4"/><text x="85" y="27" font-weight="600" fill="#14181F">Requirements &amp;</text><text x="85" y="44" font-weight="600" fill="#14181F">evaluation</text><text x="85" y="67" fill="#586170">extract · classify · assign</text></g>
      <g transform="translate(242,326)"><rect width="170" height="86" rx="4" fill="#FFFFFF" stroke="#B9C7D4"/><text x="85" y="27" font-weight="600" fill="#14181F">Strategy</text><text x="85" y="44" font-weight="600" fill="#14181F">support</text><text x="85" y="67" fill="#586170">evidence · options · gaps</text></g>
      <g transform="translate(424,326)"><rect width="170" height="86" rx="4" fill="#FFFFFF" stroke="#B9C7D4"/><text x="85" y="27" font-weight="600" fill="#14181F">Content</text><text x="85" y="44" font-weight="600" fill="#14181F">preparation</text><text x="85" y="67" fill="#586170">retrieve · structure · draft</text></g>
      <g transform="translate(606,326)"><rect width="170" height="86" rx="4" fill="#FFFFFF" stroke="#B9C7D4"/><text x="85" y="27" font-weight="600" fill="#14181F">Checks &amp;</text><text x="85" y="44" font-weight="600" fill="#14181F">traceability</text><text x="85" y="67" fill="#586170">compare · check · cite</text></g>
      <g transform="translate(788,326)"><rect width="170" height="86" rx="4" fill="#FFFFFF" stroke="#B9C7D4"/><text x="85" y="28" font-weight="600" fill="#14181F">Commercial</text><text x="85" y="45" font-weight="600" fill="#14181F">handover</text><text x="85" y="66" fill="#586170">assumptions · actions · owners</text></g>
      <g transform="translate(970,326)"><rect width="170" height="86" rx="4" fill="#FFFFFF" stroke="#B9C7D4"/><text x="85" y="27" font-weight="600" fill="#14181F">Learning &amp;</text><text x="85" y="44" font-weight="600" fill="#14181F">reuse</text><text x="85" y="67" fill="#586170">lessons · approved content</text></g>
    </g>

    <line x1="600" y1="412" x2="600" y2="442" stroke="#98A5B5" stroke-width="1.25"/>
    <polygon points="596,438 600,446 604,438" fill="#98A5B5"/>

    <g>
      <rect x="60" y="446" width="1080" height="60" rx="4" fill="#FFFFFF" stroke="#B9C7D4"/>
      <text x="88" y="471" font-size="10" font-weight="700" letter-spacing="1.1" fill="#1B3A63">ONE AGREED WORKFLOW</text>
      <text x="88" y="490" font-size="13" fill="#14181F">For example: compliance and response matrix · comparable evaluation · controlled review</text>

      <rect x="60" y="518" width="1080" height="60" rx="4" fill="#FFFFFF" stroke="#B9C7D4"/>
      <text x="88" y="543" font-size="10" font-weight="700" letter-spacing="1.1" fill="#1B3A63">SHARED RULES AND TRUSTED INFORMATION</text>
      <text x="88" y="562" font-size="13" fill="#14181F">Approved sources · clear ownership · evidence links · review points · controlled templates</text>

      <rect x="60" y="590" width="1080" height="60" rx="4" fill="#FFFFFF" stroke="#B9C7D4"/>
      <text x="88" y="615" font-size="10" font-weight="700" letter-spacing="1.1" fill="#1B3A63">YOUR APPROVED TOOLS</text>
      <text x="88" y="634" font-size="13" fill="#14181F">Project folders · approved libraries · collaboration tools · controlled outputs</text>
    </g>

    <line x1="600" y1="650" x2="600" y2="674" stroke="#98A5B5" stroke-width="1.25"/>
    <polygon points="596,670 600,678 604,670" fill="#98A5B5"/>

    <rect x="60" y="678" width="1080" height="54" rx="4" fill="#12213A"/>
    <text x="88" y="710" font-size="11" font-weight="700" letter-spacing="1.1" fill="#C8D7E5">HUMAN REVIEW AND APPROVAL</text>
    <text x="340" y="710" font-size="14" font-weight="600" fill="#FFFFFF">Review</text>
    <text x="430" y="710" font-size="14" fill="#98A5B5">→</text>
    <text x="490" y="710" font-size="14" font-weight="600" fill="#FFFFFF">Decide</text>
    <text x="590" y="710" font-size="14" fill="#98A5B5">→</text>
    <text x="650" y="710" font-size="14" font-weight="600" fill="#FFFFFF">Own</text>
    <text x="1110" y="710" text-anchor="end" font-size="12" fill="#C8D7E5">Nothing commits or sends silently.</text>
  </g>
</svg>
