<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile review</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #d9dde1; font: 14px/1.4 system-ui, sans-serif; }
    main { display: grid; grid-template-columns: repeat(3, 320px); gap: 24px; align-items: start; }
    figure { margin: 0; }
    figcaption { margin: 0 0 8px; font-weight: 700; }
    iframe { display: block; width: 320px; height: 568px; border: 1px solid #9aa1a8; background: #fff; }
  </style>
</head>
<body>
  <main>
    <figure><figcaption>Hero</figcaption><iframe src="/"></iframe></figure>
    <figure><figcaption>Value proposition</figcaption><iframe src="/#approach"></iframe></figure>
    <figure><figcaption>AI roulette</figcaption><iframe src="/#ai-roulette"></iframe></figure>
    <figure><figcaption>Business–IT gap</figcaption><iframe src="/#adoption-gap"></iframe></figure>
    <figure><figcaption>Engagements</figcaption><iframe src="/#services"></iframe></figure>
    <figure><figcaption>Experience</figcaption><iframe src="/#capabilities"></iframe></figure>
    <figure><figcaption>Capabilities</figcaption><iframe src="/#capabilities"></iframe></figure>
    <figure><figcaption>Brochure</figcaption><iframe src="/#brochure"></iframe></figure>
    <figure><figcaption>FAQ</figcaption><iframe src="/#faq"></iframe></figure>
  </main>
</body>
</html>
