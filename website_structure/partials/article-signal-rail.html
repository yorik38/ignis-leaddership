<aside class="signal-inbox article-signal-rail" aria-labelledby="signal-inbox-title">
<div class="article-signal-sticky signal-inbox-inner">
<h2 id="signal-inbox-title">Get Signal in your inbox.</h2>
<div id="hubspot-newsletter-form" class="hubspot-newsletter-form">
<form class="signal-signup-form" method="post" action="/api/subscribe" data-community-form data-signup-placement="article_end">
<div class="signal-signup-fields">
<input id="wp-signup-email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="Work email only" aria-label="Work email only. Personal email addresses are not accepted." required>
<button type="submit" aria-label="Get Signal"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
</div>
<input type="hidden" name="content_source" value="signal-signup">
<input type="hidden" name="form_started_at" value="">
<div class="form-honeypot" aria-hidden="true"><label>Company website<input type="text" name="company_website" tabindex="-1" autocomplete="off" aria-hidden="true"></label></div>
<div class="turnstile-slot" data-turnstile data-turnstile-theme="dark" data-turnstile-size="compact"></div>
<p class="signal-signup-consent">By signing up, you agree to receive Signal and occasional emails from Ignis Leadership. Unsubscribe at any time.</p>
<p class="signal-signup-success" data-form-status role="status" aria-live="polite" tabindex="-1" hidden><span class="signal-signup-tick" aria-hidden="true"></span><span>You're in. Signal arrives weekly, plus the monthly Market Monitor.</span></p>
<p class="signal-signup-error" data-form-error role="alert" hidden></p>
</form>
<noscript><p>The signup form needs JavaScript.</p></noscript>
</div>
</div>
</aside>
